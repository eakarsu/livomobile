name: livomobile-governed-matter

services:
  governed-matter:
    build:
      context: ./governed-matter
    image: livomobile-governed-matter:local
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3030"
      DATABASE_PATH: /var/lib/livomobile/matters.sqlite
      MIGRATE_ON_START: "true"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      IDEMPOTENCY_SECRET: ${IDEMPOTENCY_SECRET:?set IDEMPOTENCY_SECRET}
      DOCUMENT_PROVIDER_URL: ${DOCUMENT_PROVIDER_URL:?set DOCUMENT_PROVIDER_URL}
      DOCUMENT_PROVIDER_SECRET: ${DOCUMENT_PROVIDER_SECRET:?set DOCUMENT_PROVIDER_SECRET}
      DOCUMENT_PROVIDER_TIMEOUT_MS: ${DOCUMENT_PROVIDER_TIMEOUT_MS:-3000}
      DOCUMENT_PROVIDER_MAX_ATTEMPTS: ${DOCUMENT_PROVIDER_MAX_ATTEMPTS:-3}
    ports:
      - "127.0.0.1:${LIVOMOBILE_PORT:-3030}:3030"
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - governed_matter_data:/var/lib/livomobile
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  governed_matter_data:
    name: livomobile_governed_matter_data
